# Build Windows NSIS installer and publish to GitHub Releases.
# Official pattern: tauri-apps/tauri-action on windows-latest.
#
# Triggers:
#   - Push tag v* (e.g. v0.1.0) → create draft release + attach setup.exe
#   - workflow_dispatch → nhập version để build và tạo draft release
#
# Required repo secret:
#   HIS_XML_LICENSE_PUBLIC_KEY — Ed25519 public key (base64url) embedded at compile time

name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản SemVer để build, ví dụ 1.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply manual release version
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Version must be SemVer without a leading v, for example 1.2.3."
          }

          foreach ($path in @('package.json', 'src-tauri/tauri.conf.json')) {
            $manifest = Get-Content -Raw $path | ConvertFrom-Json
            $manifest.version = $version
            $manifest | ConvertTo-Json -Depth 100 | Set-Content -NoNewline -Encoding utf8 $path
          }

          $cargoPath = 'src-tauri/Cargo.toml'
          $cargo = Get-Content -Raw $cargoPath
          $updatedCargo = [regex]::Replace($cargo, '(?m)^version = "[^"]+"$', "version = `"$version`"", 1)
          if ($updatedCargo -eq $cargo) {
            throw "Could not update the root package version in $cargoPath."
          }
          Set-Content -NoNewline -Encoding utf8 $cargoPath $updatedCargo

          Write-Host "Building HIS XML Sync v$version"

      - name: Require production license public key
        shell: bash
        env:
          HIS_XML_LICENSE_PUBLIC_KEY: ${{ secrets.HIS_XML_LICENSE_PUBLIC_KEY }}
        run: |
          if [ -z "${HIS_XML_LICENSE_PUBLIC_KEY}" ]; then
            echo "::error::Missing secret HIS_XML_LICENSE_PUBLIC_KEY."
            echo "Add it under: Settings → Secrets and variables → Actions"
            echo "Use the PUBLIC key from: cargo run --bin license_keygen -- keypair"
            exit 1
          fi
          echo "HIS_XML_LICENSE_PUBLIC_KEY is set (${#HIS_XML_LICENSE_PUBLIC_KEY} chars)."

      - name: Build Tauri app (Windows NSIS installer)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIS_XML_LICENSE_PUBLIC_KEY: ${{ secrets.HIS_XML_LICENSE_PUBLIC_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "HIS XML Sync v__VERSION__"
          releaseBody: |
            ## HIS XML Sync for Windows

            Download **`HIS XML Sync_*_x64-setup.exe`**, run the installer, then activate with your license key.

            ### Notes
            - No need to install Node.js or Rust on the client machine.
            - WebView2 is installed automatically if missing (requires internet on first run if not present).
            - Production license public key is embedded at build time.
          releaseDraft: true
          prerelease: false
          # Prefer NSIS setup.exe; matches tauri.conf.json bundle.targets
          args: --bundles nsis

      - name: Upload installer artifact (Actions tab)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: his-xml-sync-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30
